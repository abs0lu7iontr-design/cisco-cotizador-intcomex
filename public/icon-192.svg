<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Stylized Cisco Bridge Waves -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Tall bars (bridge) -->
    <rect x="-140" y="-30" width="20" height="90" rx="10" fill="url(#primaryGrad)"/>
    <rect x="-90" y="-70" width="20" height="130" rx="10" fill="url(#primaryGrad)"/>
    <rect x="-40" y="-110" width="20" height="170" rx="10" fill="url(#primaryGrad)"/>
    <rect x="20" y="-110" width="20" height="170" rx="10" fill="url(#primaryGrad)"/>
    <rect x="70" y="-70" width="20" height="130" rx="10" fill="url(#primaryGrad)"/>
    <rect x="120" y="-30" width="20" height="90" rx="10" fill="url(#primaryGrad)"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">CISCO</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">AUTOMATED</text>
</svg>
