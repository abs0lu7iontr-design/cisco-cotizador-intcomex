name: Security & Quality Audit

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  audit-and-verify:
    name: Code Integrity & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Security & Domain Unit Tests
        run: npx tsx tests/twoFactorAdaptive.test.ts

      - name: Dependency Vulnerability Audit (Non-blocking)
        run: npm audit --audit-level=high || true
        continue-on-error: true
