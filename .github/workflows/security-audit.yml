name: Security & Quality Audit

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  audit-and-verify:
    name: Code Integrity & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Security & Domain Unit Tests
        run: npm test

      - name: Python Desktop Syntax Check
        run: python3 -m py_compile desktop_app/*.py

      - name: Dependency Vulnerability Audit (Critical Fail-Closed)
        run: npm audit --audit-level=critical

      - name: Dependency Production Report (High/Moderate Advisory Log)
        run: npm audit --omit=dev --audit-level=high || true
