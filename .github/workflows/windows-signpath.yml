name: Build and sign Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-sign-release:
    runs-on: windows-latest
    environment: signpath

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_app/requirements.txt pywebview pyinstaller

      - name: Build unsigned Windows executable
        run: python -m PyInstaller --noconfirm GravityDesktopPortable.spec

      - name: Upload unsigned executable for SignPath
        id: unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cotizador-Cisco-Intcomex-unsigned
          path: dist/Cotizador-Cisco-Intcomex-Portable.exe
          if-no-files-found: error

      - name: Submit executable to SignPath
        uses: SignPath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Upload signed executable
        uses: actions/upload-artifact@v4
        with:
          name: Cotizador-Cisco-Intcomex-Windows-${{ github.ref_name }}
          path: dist/signed
          if-no-files-found: error
